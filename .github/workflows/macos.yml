name: macOS verification
on:
  push:
    branches: [codex/dev-difficulty-telemetry]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build AppKit app
        run: ./build.sh
      - name: Native regression suite
        run: LinkedInGames.app/Contents/MacOS/LinkedInGames --self-test
      - name: Package tested app
        run: ditto -c -k --sequesterRsrc --keepParent LinkedInGames.app LinkedInGames-2.1.3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LinkedInGames-2.1.3-unsigned-feed
          path: LinkedInGames-2.1.3.zip
          if-no-files-found: error
          retention-days: 30
